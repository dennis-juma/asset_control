{% if grid.page %}

<div class="card-footer">

    <nav>

        <ul class="pagination pagination-sm justify-content-end mb-0">

            {% if grid.page.has_previous %}

            <li class="page-item">

                <a
                    class="page-link"
                    href="?page={{ grid.page.previous_page_number }}"
                >

                    Previous

                </a>

            </li>

            {% endif %}

            <li class="page-item active">

                <span class="page-link">

                    {{ grid.page.number }}

                </span>

            </li>

            {% if grid.page.has_next %}

            <li class="page-item">

                <a
                    class="page-link"
                    href="?page={{ grid.page.next_page_number }}"
                >

                    Next

                </a>

            </li>

            {% endif %}

        </ul>

    </nav>

</div>

{% endif %}

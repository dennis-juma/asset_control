<div class="card shadow-sm">

    <div class="card-body">

        <h6>

            {{ card.title }}

        </h6>

        <h4>

            {{ card.value }}

        </h4>

        <div class="progress">

            <div
                class="progress-bar bg-{{ card.colour }}"
                style="width:{{ card.progress }}%"
            ></div>

        </div>

    </div>

</div>

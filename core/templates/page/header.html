<div class="mb-4">

    {% include "components/page/breadcrumb.html" %}

    <h2 class="mb-1">

        {{ page.title }}

    </h2>

    {% if page.subtitle %}

        <p class="text-muted">

            {{ page.subtitle }}

        </p>

    {% endif %}

{% if page.description %}
    {% for line in page.description %}
        <p class="text-muted mb-1">
            {{ line }}
        </p>
    {% endfor %}
{% endif %}

</div>

{% extends "layouts/base.html" %}

{% block content %}

<div class="row g-4">

{% for component in components %}

<div class="col-md-3">

    <a href="{% url component.url %}"
       class="card shadow-sm h-100 text-decoration-none">

        <div class="card-body">

            <i class="bi bi-{{ component.icon }} fs-2"></i>

            <h5 class="mt-3">

                {{ component.name }}

            </h5>

            <p class="text-muted">

                {{ component.description }}

            </p>

        </div>

    </a>

</div>

{% endfor %}

</div>
{% endblock %}

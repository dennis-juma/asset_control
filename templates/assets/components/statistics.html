            <div class="card-body">

                <small class="text-muted">Total Assets</small>

                <h3 class="fw-bold mb-0">
                    {{ asset_list.statistics.total }}
                </h3>

            </div>

        </div>

    </div>

    <div class="col-md-6 col-xl-3">

        <div class="card shadow-sm border-0">

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Password reset{% endblock %} | Asset Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-form input { display: block; width: 100%; padding: .5rem .75rem; border: 1px solid #dee2e6; border-radius: .375rem; }
        .auth-form label { margin-bottom: .5rem; }
        .auth-form .errorlist { color: #b02a37; }
        .auth-form .helptext { display: block; margin-top: .5rem; color: #6c757d; font-size: .875rem; }
    </style>
</head>
<body class="bg-light">
    <main class="container">
        <div class="row justify-content-center align-items-center min-vh-100 py-4">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm border-0"><div class="card-body p-4">
                    {% block content %}{% endblock %}
                    <div class="text-center mt-3"><a href="{% url 'accounts:login' %}">Back to sign in</a></div>
                </div></div>
            </div>
        </div>
    </main>
</body>
</html>

{% extends "accounts/auth_base.html" %}
{% block content %}
{% if validlink %}
<h3 class="fw-bold">Choose a new password</h3>
<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Reset password</button>
</form>
{% else %}
<h3 class="fw-bold">Reset link unavailable</h3>
<p>This password reset link is invalid or has expired. Please request a new one.</p>
<a class="btn btn-primary w-100" href="{% url 'accounts:password_reset' %}">Request a new link</a>
{% endif %}
{% endblock %}

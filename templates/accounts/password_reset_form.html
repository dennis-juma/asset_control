{% extends "accounts/auth_base.html" %}
{% block content %}
<h3 class="fw-bold">Reset your password</h3>
<p class="text-muted">Enter the email address associated with your account and we'll send you a password reset link.</p>
<form method="post" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Send reset link</button>
</form>
{% endblock %}

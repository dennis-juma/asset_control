{% extends "admin/base_site.html" %}

{% block content %}

<h1>Transfer Asset</h1>

<p>
    <strong>Asset:</strong> {{ assignment.asset }}
</p>

<p>
    <strong>Current Employee:</strong> {{ assignment.employee }}
</p>

<form method="post">
    {% csrf_token %}

    <table>
        {{ form.as_table }}
    </table>

    <div style="margin-top:20px;">
        <input
            type="submit"
            value="Transfer"
            class="default"
        >

        <a href="{% url 'admin:assets_assetassignment_changelist' %}">
            Cancel
        </a>
    </div>

</form>

{% endblock %}

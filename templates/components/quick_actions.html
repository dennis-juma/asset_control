<div class="card shadow-sm border-0 h-100">

    <div class="card-header bg-white">
        <h5 class="mb-0">
            <i class="bi bi-lightning-charge me-2"></i>
            Quick Actions
        </h5>
    </div>

    <div class="card-body">

        <div class="row g-3">

            {% for action in quick_actions %}

                <div class="col-6">

                    <a href="{{ action.url }}"
                       class="btn btn-outline-{{ action.color }} w-100 py-3">

                        <i class="{{ action.icon }} fs-3 d-block mb-2"></i>

                        {{ action.title }}

                    </a>

                </div>

            {% endfor %}

        </div>

    </div>

</div>

<nav aria-label="breadcrumb">
    <ol class="breadcrumb">

        {% for item in page.breadcrumb %}

            {% if not item.url %}

                <li class="breadcrumb-item active">
                    {{ item.label }}
                </li>

            {% else %}

                <li class="breadcrumb-item">
                    <a href="{{ item.url }}">
                        {{ item.label }}
                    </a>
                </li>

            {% endif %}

        {% endfor %}

    </ol>
</nav>

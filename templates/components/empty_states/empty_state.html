<div class="text-center py-5">

    <i class="bi {{ icon }} display-3 text-secondary"></i>

    <h4 class="mt-3">
        {{ title }}
    </h4>

    <p class="text-muted">
        {{ message }}
    </p>

    {% if button_text and button_url %}
        <a href="{{ button_url }}" class="btn btn-primary">
            {{ button_text }}
        </a>
    {% endif %}

    {% if image %}
<img src="{{ image }}"
     class="img-fluid mb-4">
{% endif %}

</div>

<div class="card border-0 shadow-sm h-100">
    <div class="card-body">

        <h5 class="card-title">
            {{ title }}
        </h5>

        <p class="text-muted">
            {{ content }}
        </p>

        {% if footer %}
            <div class="mt-3">
                {{ footer }}
            </div>
        {% endif %}

    </div>
</div>

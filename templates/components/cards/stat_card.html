{% load humanize %}

<div class="col">

    <div class="card stat-card shadow-sm border-0 h-100">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-start">

                <div>

                    <small class="text-muted text-uppercase">
                        {{ card.title }}
                    </small>

                    <h2 class="fw-bold mt-2">

                        {% if card.formatter == "percentage" %}
                            {{ card.value }}%
                        {% else %}
                            {{ card.value|intcomma }}
                        {% endif %}

                    </h2>

                </div>

                <div class="stat-icon bg-{{ card.color }}">
                    <i class="bi {{ card.icon }}"></i>
                </div>

            </div>

            {% if card.subtitle %}
                <div class="mt-3">
                    <small class="text-muted">
                        {{ card.subtitle }}
                    </small>
                </div>
            {% endif %}

            {% if card.trend is not None %}
                <div class="mt-2">
                    <small class="text-success">
                        {{ card.trend }}%
                    </small>
                </div>
            {% endif %}

        </div>

    </div>

</div>

<div class="d-flex justify-content-end gap-2 mt-4">

    {% for action in form.actions %}

        {% if action.submit %}

            <button
                class="btn btn-{{ action.style }}"
                type="submit"
            >

                {% if action.icon %}

                    <i class="bi {{ action.icon }}"></i>

                {% endif %}

                {{ action.label }}

            </button>

        {% else %}

            <a
                href="{{ action.url }}"
                class="btn btn-{{ action.style }}"
            >

                {{ action.label }}

            </a>

        {% endif %}

    {% endfor %}

</div>

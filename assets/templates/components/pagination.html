{% if page.content.page %}

<nav class="mt-3">

    <ul class="pagination justify-content-end">

        {% if page.content.page.has_previous %}

        <li class="page-item">

            <a class="page-link"
               href="?page={{ page.content.page.previous_page_number }}&q={{ page.content.search_query }}">

                Previous

            </a>

        </li>

        {% endif %}

        {% for num in page.content.page.paginator.page_range %}

            <li class="page-item {% if num == page.content.page.number %}active{% endif %}">

                <a class="page-link"
                   href="?page={{ num }}&q={{ page.content.search_query }}">

                    {{ num }}

                </a>

            </li>

        {% endfor %}

        {% if page.content.page.has_next %}

        <li class="page-item">

            <a class="page-link"
               href="?page={{ page.content.page.next_page_number }}&q={{ page.content.search_query }}">

                Next

            </a>

        </li>

        {% endif %}

    </ul>

</nav>

{% endif %}

{% extends "layouts/app.html" %}
{% block content %}
<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h3 mb-1">Asset Document Processing</h1><p class="text-muted mb-0">Checklist extraction, correction and reporting</p></div><a class="btn btn-primary" href="{% url 'document_processing:upload' %}"><i class="bi bi-upload me-1"></i> Upload PDFs</a></div>
  {% if messages %}{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}{% endif %}
  {% block module_content %}{% endblock %}
</div>
{% endblock %}

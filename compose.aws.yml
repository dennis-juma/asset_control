services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.aws
    container_name: asset_control_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
    ports:
      - "127.0.0.1:8000:8000"
    command: "gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 120"
    mem_limit: 600m
